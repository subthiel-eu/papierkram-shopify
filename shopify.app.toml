# Diese Datei wird von `shopify app config link` mit der eigenen App-ID ergaenzt.
name = "Papierkram"
handle = "papierkram"
application_url = "https://example.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_orders,write_orders,read_draft_orders,write_draft_orders,read_customers,write_customers,read_products"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Alle fachlichen Topics laufen auf eine Route. Welches Topic welchen
  # Geschaeftsfall ausloest, stellt jeder Shop selbst ein - siehe
  # app/sync/business-cases.ts und Einstellungen -> Geschaeftsfaelle.
  [[webhooks.subscriptions]]
  topics = [
    "orders/create",
    "orders/updated",
    "orders/paid",
    "orders/cancelled",
    "orders/fulfilled",
    "orders/partially_fulfilled",
    "fulfillments/create",
    "draft_orders/create",
    "draft_orders/update",
    "customers/create",
    "customers/update",
    "refunds/create"
  ]
  uri = "/webhooks/business"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[pos]
embedded = false
